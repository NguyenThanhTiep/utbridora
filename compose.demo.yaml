name: utbridora-week1-demo
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: utbridora_week1_demo
      MYSQL_USER: bridora
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set demo DB password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set separate root password}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00", "--innodb-buffer-pool-size=128M", "--max-connections=60"]
    volumes: ["demo_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
  backend:
    build:
      context: .
      args: {SOURCE_REVISION: '${DEMO_SOURCE_REVISION:-local-uncommitted}'}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/utbridora_week1_demo?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: bridora
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: 'true'
      APP_PUBLIC_URL: https://${DEMO_HOST:?Set LAN IP}:8443
      SPRING_PROFILES_ACTIVE: demo
      APP_DEMO_WEEK1_ENABLED: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set synthetic demo account password}
      BOOTSTRAP_ADMIN_EMAIL: ''
      BOOTSTRAP_ADMIN_PASSWORD: ''
      ALLOW_DEMO_VERIFICATION: 'false'
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_FROM: demo@utbridora.example.test
      DEBUG: 'false'
      TZ: UTC
    depends_on:
      mysql: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  frontend:
    build:
      context: ./web-demo
      args: {SOURCE_REVISION: '${DEMO_SOURCE_REVISION:-local-uncommitted}'}
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 64m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    environment:
      DEMO_HOST: ${DEMO_HOST}
    ports: ["${DEMO_BIND:-0.0.0.0}:8443:8443"]
    volumes: ["./deploy/demo.Caddyfile:/etc/caddy/Caddyfile:ro", "demo_caddy_data:/data", "demo_caddy_config:/config"]
    depends_on:
      frontend: {condition: service_healthy}
    mem_limit: 96m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8027:8025"]
    mem_limit: 64m
    restart: unless-stopped
volumes:
  demo_mysql:
  demo_caddy_data:
  demo_caddy_config:
