# Deployment configuration for the official 1.4 LTS image. No user file mount.
Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogVerbose no
LogClean no
ExtendedDetectionInfo no
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanPE yes
ScanELF yes
ScanHTML yes
StreamMaxLength 20M
MaxScanSize 100M
MaxFileSize 100M
MaxFiles 1000
MaxRecursion 10
MaxThreads 2
MaxQueue 8
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertOLE2Macros yes
CommandReadTimeout 5
ReadTimeout 60
MaxScanTime 60000
SelfCheck 300
ConcurrentDatabaseReload no
# Startup guard; continuous freshness must also be monitored operationally.
FailIfCvdOlderThan 7
