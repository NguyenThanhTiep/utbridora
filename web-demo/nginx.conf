# Keep proxy-generated file size errors in the same safe JSON envelope as the API.
map $request_id $file_request_id {
    "~^(?<file_r1>[0-9a-f]{8})(?<file_r2>[0-9a-f]{4})(?<file_r3>[0-9a-f]{4})(?<file_r4>[0-9a-f]{4})(?<file_r5>[0-9a-f]{12})$" "$file_r1-$file_r2-$file_r3-$file_r4-$file_r5";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /api/v1/files {
        client_max_body_size 21m;
        error_page 413 = @file_too_large;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        access_log off;
    }
    location @file_too_large {
        internal;
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $file_request_id always;
        access_log off;
        return 413 '{"errorCode":"FILE_TOO_LARGE","error":"FILE_TOO_LARGE","message":"File request exceeds the size limit.","requestId":"$file_request_id","fieldErrors":[],"retryAfterSeconds":null}';
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        # No access log with token-bearing paths or query strings.
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
