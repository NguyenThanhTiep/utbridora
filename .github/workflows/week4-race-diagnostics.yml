name: Temporary week 4 race diagnostics
on:
  push:
    branches: [integration/week4-20261118]
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B test-compile failsafe:integration-test failsafe:verify '-Dit.test=EnterpriseProposalIT#twenty*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-diagnostics
          path: target/failsafe-reports/
