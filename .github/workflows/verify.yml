name: Core platform verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  # Preserve every main/tag run; superseded DEV/PR runs can be cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/contracts/requirements.txt
      - run: python -m pip install -r scripts/contracts/requirements.txt
      - run: python scripts/contracts/test_bundle_portability.py
      - run: python scripts/contracts/test_audit_registry.py
      - run: python scripts/fixtures/t4/verify_s1_s11_fixture.py
      - run: python scripts/contracts/build_contract_bundle.py --check
      - run: python scripts/contracts/verify_contracts.py --output target/contract-verification.json
      - name: Report contract totals
        run: |
          python - <<'PY'
          import json
          print('::notice title=Contract summary::' + json.dumps(json.load(open('target/contract-verification.json', encoding='utf-8'))['counts']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results
          path: target/contract-verification.json
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web-demo/package-lock.json}
      - run: npm ci && npm run build
        working-directory: web-demo
      - run: mvn -B -DskipITs verify
      - name: Report unit results
        if: always()
        run: python scripts/ci/report_failures.py --unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/ci-result-summary.json
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python scripts/ci/integration_shards.py plan --shard ${{ matrix.shard }} --shards 3
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web-demo/package-lock.json}
      - run: npm ci
        working-directory: web-demo
      - run: npx playwright install --with-deps chromium
        working-directory: web-demo
      # Compile tests without running Surefire again. Each runner keeps IT forks sequential.
      - run: >-
          mvn -B test-compile failsafe:integration-test failsafe:verify
          -Dfailsafe.includesFile=target/ci-includes.txt
          -Dfrontend.e2e=true -Dt5.week3.browser=true
      - run: python scripts/ci/integration_shards.py check
      - name: Report integration results
        if: always()
        run: python scripts/ci/report_failures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.shard }}
          path: |
            target/ci-shard.json
            target/ci-includes.txt
            target/ci-result-summary.json
            target/failsafe-reports/
            target/*browser-results.xml
            target/*browser.xml
            target/*browser.log
            target/week3-*.png
            target/*e2e.log
            target/student-browser.log
            web-demo/test-results/
  # Keep the existing required-check name, and fail if any dependency is skipped/failed.
  verify:
    if: ${{ always() }}
    needs: [contracts, fast, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Verification did not pass: {failed}')
          print('Contracts, unit/build and all integration shards passed.')
          PY
