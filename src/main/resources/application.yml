spring:
  config:
    import: "optional:file:./.env.local[.properties]"
  application:
    name: utbridora-auth
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 0
      resolve-lazily: true
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/utbridora?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USER:bridora} # IDE dùng MySQL Docker; Compose truyền địa chỉ mysql:3306 riêng.
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp:
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
        auth: ${MAIL_AUTH:false}
        starttls.enable: ${MAIL_STARTTLS:false}
        starttls.required: ${MAIL_STARTTLS:false}
server:
  tomcat:
    # Bounded drain lets clients receive 413 for requests just above the multipart limit.
    max-swallow-size: 22MB
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false} # true behind HTTPS in production
        same-site: lax
app:
  matching:
    advisory:
      enabled: ${AI_ADVISORY_ENABLED:false}
      worker-enabled: ${AI_ADVISORY_WORKER_ENABLED:false}
    semantic:
      # Optional school-only shadow processing; no public API or canonical score changes.
      enabled: ${AI_MATCHING_ENABLED:false}
      base-url: ${AI_MATCHING_BASE_URL:}
      token: ${AI_INTERNAL_TOKEN:}
      model-revision: ${AI_MODEL_REVISION:614241f622f53c4eeff9890bdc4f31cfecc418b3}
      timeout-ms: ${AI_MATCHING_TIMEOUT_MS:12000}
      work-timeout-ms: ${AI_MATCHING_WORK_TIMEOUT_MS:60000}
      queue-capacity: ${AI_MATCHING_QUEUE_CAPACITY:1}
      retained-runs: ${AI_MATCHING_RETAINED_RUNS:8}
      max-profiles: ${AI_MATCHING_MAX_PROFILES:5000}
      result-ttl-seconds: ${AI_MATCHING_RESULT_TTL_SECONDS:300}
  onboarding:
    import-worker-enabled: ${STUDENT_IMPORT_WORKER_ENABLED:false}
    activation-events-enabled: ${STUDENT_ACTIVATION_EVENTS_ENABLED:false}
    mail:
      worker-enabled: ${ACTIVATION_MAIL_WORKER_ENABLED:false}
      dispatch-per-minute: ${MAIL_DISPATCH_PER_MINUTE:60}
      key-id: ${ACTIVATION_MAIL_KEY_ID:}
      keys: ${ACTIVATION_MAIL_KEYS:}
  files:
    # Absolute private directory; missing configuration keeps uploads unavailable.
    storage-root: ${FILE_STORAGE_ROOT:}
    scan:
      enabled: ${FILE_SCAN_ENABLED:false}
      host: ${FILE_SCAN_HOST:}
      port: ${FILE_SCAN_PORT:3310}
  t3:
    week3:
      http:
        enabled: ${T3_WEEK3_HTTP_ENABLED:true}
  t5:
    demand:
      # Deployment switch only. Access still requires current authorization and authoritative references.
      enabled: ${T5_DEMAND_ENABLED:true}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@utbridora.local}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    allow-org-verification: ${ALLOW_DEMO_VERIFICATION:false}
management:
  health:
    mail:
      enabled: false # SMTP availability must not take down identity/session health.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
