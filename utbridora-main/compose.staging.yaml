name: utbridora-staging
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: utbridora
      MYSQL_USER: bridora
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a unique staging DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes: ["staging_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/utbridora?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: bridora
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      COOKIE_SECURE: 'true'
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set HTTPS staging URL}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ALLOW_DEMO_VERIFICATION: 'false'
      MAIL_HOST: ${MAIL_HOST:?Set staging SMTP host}
      MAIL_FROM: ${MAIL_FROM:?Set verified staging sender address}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      DEBUG: 'false'
      TZ: UTC
    depends_on:
      mysql: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  frontend:
    build: ./web-demo
    ports: ["127.0.0.1:${STAGING_HTTP_PORT:-8088}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  staging_mysql:
